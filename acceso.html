<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso Admin - PRONTA</title>
    <!-- Cargamos Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f4; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        input { display: block; width: 100%; margin: 10px 0; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;}
        button { background: #333; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; width: 100%;}
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Panel PRONTA</h2>
        <input type="email" id="email" placeholder="Tu Email">
        <input type="password" id="password" placeholder="Tu Contraseña">
        <button onclick="login()">Ingresar</button>
        <p id="error-msg" style="color: red; font-size: 14px;"></p>
    </div>

    <script>
        // TUS CLAVES DE SUPABASE
        const supabase = window.supabase.createClient('https://xipumaajfvfxksacigae.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpcHVtYWFqZnZmeGtzYWNpZ2FlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxNzU0NzAsImV4cCI6MjEwOTc1MTQ3MH0.xkVSPpK8FATICtj1JlZw32PapeMllHvKgA4MMV_Zj2Y');

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            
            errorMsg.innerText = "Verificando...";

            // Le pedimos a Supabase que verifique tu contraseña
            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                errorMsg.innerText = "Datos incorrectos. Intento bloqueado.";
            } else {
                errorMsg.innerText = "¡Acceso concedido! Entrando...";
                // Si todo está bien, te mandamos a tu panel oculto
                window.location.href = "/PANEL ADMIN"; // <-- PONÉ EL NOMBRE DE TU PANEL ACÁ
            }
        }
    </script>
</body>
</html>
