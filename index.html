<!DOCTYPE html>
<html lang="es">
  <head>
    <title>PRONTA — Belleza & Cosmética</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="PRONTA Belleza & Cosmética: Productos cosméticos, Kits & Gift y Servicios de limpieza facial.">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="css/vendor.css">
    <link rel="stylesheet" type="text/css" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">

    <style>
      :root {
        --pronta-bg: #FAF8F6;
        --pronta-rose: #D4A3A3;
        --pronta-rose-dark: #B57D7D;
        --pronta-rose-soft: #F6ECEC;
        --pronta-sage: #A3B19B;
        --pronta-sage-dark: #6E7D66;
        --pronta-sage-soft: #EEF2EC;
        --pronta-charcoal: #333333;
        --pronta-muted: #666666;
      }

      body {
        background-color: var(--pronta-bg);
        color: var(--pronta-charcoal);
        font-family: 'Nunito', sans-serif;
      }

      h1, h2, h3, h4, .brand-serif {
        font-family: 'Playfair Display', serif;
        color: var(--pronta-charcoal);
      }

      .brand-logo-text {
        font-family: 'Playfair Display', serif;
        font-size: 1.9rem;
        letter-spacing: 0.22em;
        font-weight: 700;
        color: var(--pronta-charcoal);
        line-height: 1;
        text-decoration: none;
      }
      .brand-logo-sub {
        display: block;
        font-family: 'Nunito', sans-serif;
        font-size: 0.65rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--pronta-rose-dark);
        margin-top: 4px;
      }

      .btn-pronta {
        background-color: var(--pronta-charcoal);
        color: #FFFFFF;
        border: 1px solid var(--pronta-charcoal);
        transition: all 0.2s ease;
      }
      .btn-pronta:hover {
        background-color: var(--pronta-rose);
        border-color: var(--pronta-rose);
        color: var(--pronta-charcoal);
      }
      .btn-outline-pronta {
        color: var(--pronta-charcoal);
        border: 1px solid var(--pronta-charcoal);
        background: transparent;
      }
      .btn-outline-pronta:hover, .btn-outline-pronta.active-pill {
        background-color: var(--pronta-sage);
        border-color: var(--pronta-sage);
        color: var(--pronta-charcoal);
        font-weight: 700;
      }

      .text-pronta { color: var(--pronta-rose-dark) !important; }
      .text-pronta-sage { color: var(--pronta-sage-dark) !important; }
      .bg-pronta-soft {
        background-color: var(--pronta-rose-soft) !important;
        border: 1px solid var(--pronta-rose);
      }
      .bg-pronta-sage { background-color: var(--pronta-sage-soft) !important; }

      .badge.bg-success {
        background-color: var(--pronta-sage) !important;
        color: var(--pronta-charcoal) !important;
      }
      .text-success {
        color: var(--pronta-sage-dark) !important;
      }

      .announcement-bar {
        background-color: var(--pronta-charcoal);
        color: #FAF8F6;
        font-size: 0.82rem;
        letter-spacing: 0.04em;
      }
      .announcement-bar strong {
        color: var(--pronta-rose);
      }

      .banner-ad.block-1 {
        background: linear-gradient(135deg, #F6ECEC 0%, #E8CACA 100%) !important;
        border: 1px solid rgba(212, 163, 163, 0.45);
      }
      .banner-ad.block-2 {
        background: linear-gradient(135deg, #EEF2EC 0%, #D5DFD0 100%) !important;
        border: 1px solid rgba(163, 177, 155, 0.45);
      }
      .banner-ad.block-3 {
        background: linear-gradient(135deg, #F4F1EE 0%, #E6DFDA 100%) !important;
        border: 1px solid rgba(51, 51, 51, 0.12);
      }

      .product-item {
        background: #FFFFFF;
        border: 1px solid #EBE6E2;
        border-radius: 16px;
        padding: 16px;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      }
      .product-item:hover {
        transform: translateY(-4px);
        border-color: var(--pronta-rose);
        box-shadow: 0 12px 24px rgba(51, 51, 51, 0.08);
      }
      .product-item figure {
        background: var(--pronta-bg);
        border-radius: 12px;
        height: 210px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        margin-bottom: 12px;
        cursor: pointer;
      }
      .product-item figure img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .product-item h3 {
        font-size: 1.05rem;
        margin-bottom: 4px;
        cursor: pointer;
      }
      .product-item .price {
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--pronta-charcoal);
      }
      .product-badge-section {
        font-size: 0.7rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        background-color: var(--pronta-rose);
        color: var(--pronta-charcoal);
        padding: 3px 10px;
        border-radius: 999px;
        display: inline-block;
        margin-bottom: 6px;
        font-weight: 700;
      }

      .nav-tabs .nav-link {
        color: var(--pronta-muted);
        border: none;
        border-bottom: 2px solid transparent;
        font-weight: 700;
        letter-spacing: 0.06em;
      }
      .nav-tabs .nav-link:hover {
        color: var(--pronta-charcoal);
      }
      .nav-tabs .nav-link.active {
        color: var(--pronta-charcoal);
        background: transparent;
        border-bottom: 2px solid var(--pronta-rose);
      }

      .category-item {
        background: #FFFFFF;
        border: 1px solid #EBE6E2;
        border-radius: 16px;
        padding: 22px 14px !important;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .category-item:hover, .category-item.active-cat {
        border-color: var(--pronta-sage);
        background: var(--pronta-sage-soft);
      }

      .payment-option-card {
        border: 1.5px solid #E5DFDA;
        border-radius: 12px;
        padding: 12px 14px;
        cursor: pointer;
        transition: all 0.2s ease;
        background: #fff;
      }
      .payment-option-card.selected {
        border-color: var(--pronta-rose);
        background-color: var(--pronta-rose-soft);
      }

      .toast-container-pronta {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 9999;
      }
      .pronta-toast {
        background: var(--pronta-charcoal);
        color: #fff;
        border-left: 4px solid var(--pronta-rose);
        padding: 12px 20px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(51,51,51,0.2);
        font-size: 0.9rem;
        margin-top: 8px;
        animation: fadeInToast 0.25s ease;
      }
      @keyframes fadeInToast {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>

    <!-- Barra superior de beneficios -->
    <div class="announcement-bar py-2 text-center">
      <div class="container-fluid">
        <span>✨ <strong>5% OFF</strong> abonando por Transferencia Bancaria o Efectivo (con seña) · Mercado Pago disponible ✨</span>
      </div>
    </div>

    <!-- Carrito lateral (Offcanvas) -->
    <div class="offcanvas offcanvas-end" data-bs-scroll="true" tabindex="-1" id="offcanvasCart" aria-labelledby="Mi Carrito">
      <div class="offcanvas-header border-bottom">
        <h5 class="mb-0 brand-serif">Tu Carrito PRONTA</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
      </div>
      <div class="offcanvas-body d-flex flex-column justify-content-between">
        <div>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="text-muted small">Productos seleccionados</span>
            <span class="badge rounded-pill" style="background-color:#333333;
